worker_processes 1;
events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    types { application/vnd.android.package-archive apk; }
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    autoindex     off;

    # Quiet log (LAN-09, NFR-10): time, request, status, size. No user agent, referrer or query strings.
    log_format provisioning '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log provisioning;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 443 ssl default_server;
        # Must match the hostname in the QR and the certificate.
        server_name enroll.devices.example.com;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_stapling        off;   # no OCSP fetches; the server has no WAN

        root /srv/site;

        location = /        { try_files /qr/index.html =404; }
        location = /healthz { return 200 "ok\n"; default_type text/plain; }

        location /qr/ {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        # Immutable, checksum-pinned APKs: exact bytes, 200 only, never a redirect (LAN-03).
        location /releases/ {
            types { application/vnd.android.package-archive apk; }
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / { return 404; }
    }
}
