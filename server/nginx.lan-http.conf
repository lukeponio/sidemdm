# Self-contained LAN mode: plain HTTP on port 80, no domain, DNS or certificate.
# The QR's SHA-256 package checksum is what protects the APK; the transfer itself is unencrypted.
worker_processes 1;
events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    autoindex     off;

    log_format provisioning '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log provisioning;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        root /srv/site;

        location = /        { try_files /qr/index.html =404; }
        location = /healthz { return 200 "ok\n"; default_type text/plain; }
        location /qr/       { add_header Cache-Control "no-store"; try_files $uri =404; }
        location /releases/ {
            types { application/vnd.android.package-archive apk; }
            default_type application/vnd.android.package-archive;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
